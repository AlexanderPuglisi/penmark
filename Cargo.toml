[workspace]
resolver = "3"
members = [
    "crates/penmark-core",
    "crates/penmark-keystore",
    "crates/penmark-cli",
    "crates/penmark-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Alexander Puglisi"]
repository = "https://github.com/AlexanderPuglisi/penmark"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
